name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: mvn package

      - name: Backup current JAR
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: cp /opt/breviare/breviare.jar /opt/breviare/breviare.jar.bak

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: target/breviare.jar
          target: /opt/breviare/
          strip_components: 1

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: systemctl --user restart breviare

      - name: Health check with rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # App takes ~245s to start on this instance; don't probe before it can plausibly be up.
            echo "Warmup: waiting 180s before probing"
            sleep 180
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/api/health > /dev/null; then
                echo "Healthy after $((180 + (i - 1) * 10))s"
                exit 0
              fi
              sleep 10
            done
            echo "Health check failed, rolling back"
            cp /opt/breviare/breviare.jar.bak /opt/breviare/breviare.jar
            systemctl --user restart breviare
            exit 1
